name: Publish package

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  # Required for npm trusted publishing (OIDC) and provenance attestation.
  # No long-lived npm token is stored anywhere: the registry exchanges this
  # workflow's OIDC identity for a short-lived publish credential.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.17.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build
        run: pnpm build

      # Authentication comes from the OIDC exchange above, so no NODE_AUTH_TOKEN
      # is set here. Requires a trusted publisher to be configured for this
      # package on npmjs.com (Settings -> Trusted Publisher).
      - name: Publish
        run: pnpm publish --no-git-checks
